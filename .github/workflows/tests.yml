name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, tipos y nucleo van juntos porque ninguno necesita navegador y entre todos
  # tardan segundos: separarlos solo anadiria arranques de runner.
  unit:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Formato
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Tipos
        run: mypy

      - name: Pruebas unitarias
        run: pytest tests/unit -q

  integration:
    name: Pruebas de integracion (navegador)
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # La descarga del navegador son unos 130 MB y es lo unico lento del pipeline.
      # La clave lleva la version de Playwright: si cambia, el cache se invalida solo.
      - name: Version de Playwright
        id: pw
        run: |
          version=$(python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache del navegador
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Instalar Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      # Aunque el navegador venga del cache, las librerias del sistema no se cachean.
      - name: Dependencias del sistema
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Pruebas de integracion
        run: pytest tests/integration -q
