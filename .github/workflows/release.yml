name: Publicar

# Se dispara al crear una etiqueta `v*`, y solo entonces: publicar es irreversible
# —una version de PyPI no se puede reemplazar— asi que no puede pasar por accidente al
# empujar a main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  comprobar:
    name: Comprobaciones previas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Formato, lint y tipos
        run: |
          ruff format --check .
          ruff check .
          mypy

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Pruebas
        run: pytest -q

  construir:
    name: Construir el paquete
    runs-on: ubuntu-latest
    needs: comprobar

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Construir
        run: |
          pip install build
          python -m build

      # `twine check` pilla el error mas tonto y mas frecuente: un README que PyPI no
      # sabe renderizar. Se ve aqui y no despues de haber publicado.
      - name: Revisar los metadatos
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: paquete
          path: dist/

  publicar:
    name: Publicar en PyPI
    runs-on: ubuntu-latest
    needs: construir
    environment: pypi
    permissions:
      # Publicacion confiable: PyPI verifica que el paquete viene de este repositorio y
      # de este flujo. No hace falta guardar ningun token en los secretos.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquete
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
