<meta charset="utf-8">
<title>Reproductor que se queda los clics</title>
<!--
  El reproductor flotante se despega al hacer scroll y acaba cruzado por delante
  del boton, quedandose con los clics. Es un caso real y frecuente en las webs
  con emision en directo.

  Aqui Playwright si protege: su comprobacion de accionabilidad ve que otro
  elemento recibe el punto y reintenta hasta agotar el tiempo. Esta pagina existe
  para fijar esa frontera — donde acaba lo que ya cubre Playwright y donde empieza
  lo que cubre ActionPrufe— y para garantizar que ese fallo se propaga tal cual en
  vez de convertirse en un veredicto inventado.
-->
<main>
  <h1>Reservas</h1>

  <section data-ap-region="lista" aria-label="Vuelos">
    <ul>
      <li><button id="reservar">Reservar Bilbao Madrid</button></li>
    </ul>
  </section>

  <section data-ap-region="reservas" aria-label="Mis reservas">
    <ul id="reservas"></ul>
  </section>
</main>

<div id="reproductor" aria-hidden="true">Winamax TV</div>

<style>
  #reproductor {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 200px;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    z-index: 999;
  }
</style>

<script>
  document.getElementById("reservar").addEventListener("click", () => {
    const li = document.createElement("li");
    li.textContent = "Bilbao Madrid confirmado";
    document.getElementById("reservas").appendChild(li);
  });
</script>
